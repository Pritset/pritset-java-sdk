name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Java ${{ matrix.java }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21', '25']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Verify vendored contract
        shell: pwsh
        run: ./scripts/verify-contract.ps1
      - run: bash ./mvnw -B -ntp verify

  package-consumer:
    name: Package and clean consumer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: bash ./mvnw -B -ntp install
      - run: bash ./mvnw -f examples/pom.xml -B -ntp verify
      - name: Maven Central release-profile dry run
        run: bash ./mvnw -B -ntp -Pcentral -Dcentral.skipPublishing=true -Dgpg.skip=true verify

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v5
