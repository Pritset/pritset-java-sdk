name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  maven-central:
    runs-on: ubuntu-latest
    environment: maven-central
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_PASSWORD
      - name: Verify release version
        shell: bash
        run: |
          set -euo pipefail
          PROJECT_VERSION="$(bash ./mvnw help:evaluate -Dexpression=project.version -q -DforceStdout)"
          if [[ "$GITHUB_REF_NAME" != "v$PROJECT_VERSION" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match project version $PROJECT_VERSION."
            exit 1
          fi
      - name: Import signing key
        shell: bash
        env:
          GPG_PRIVATE_KEY_BASE64: ${{ secrets.GPG_PRIVATE_KEY_BASE64 }}
        run: echo "$GPG_PRIVATE_KEY_BASE64" | base64 --decode | gpg --batch --import
      - run: pwsh ./scripts/verify-contract.ps1
      - run: bash ./mvnw -B -ntp verify
      - name: Publish to Maven Central
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: bash ./mvnw -B -ntp -Pcentral -Dgpg.passphrase="$MAVEN_GPG_PASSPHRASE" deploy
