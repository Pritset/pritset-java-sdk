name: Production test-user lifecycle

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type RUN-PRODUCTION-TEST to confirm the production test-user lifecycle
        required: true
        type: string

permissions:
  contents: read

jobs:
  production-lifecycle:
    if: ${{ inputs.confirmation == 'RUN-PRODUCTION-TEST' }}
    runs-on: ubuntu-latest
    environment: production-test
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Verify and build without credentials
        shell: bash
        run: |
          set -euo pipefail
          pwsh ./scripts/verify-contract.ps1
          bash ./mvnw -B -ntp verify
          bash ./mvnw -B -ntp dependency:build-classpath -Dmdep.outputFile=target/production-lifecycle.classpath -Dmdep.includeScope=test
      - name: Run production test-user lifecycle
        shell: bash
        env:
          PRITSET_BASE_URL: https://api.pritset.com
          PRITSET_ACCESS_TOKEN: ${{ secrets.PRITSET_ACCESS_TOKEN }}
          PRITSET_SECRET: ${{ secrets.PRITSET_SECRET }}
          PRITSET_WEBHOOK_URL: ${{ secrets.PRITSET_WEBHOOK_URL }}
          PRITSET_ALLOW_PRODUCTION: 'true'
          PRITSET_PRODUCTION_TEST_USER_CONFIRMED: ${{ vars.PRITSET_PRODUCTION_TEST_USER_CONFIRMED }}
          PRITSET_TEST_RUN_PREFIX: pritset-sdk-production-test
          PRITSET_WEBHOOK_SETTLE_SECONDS: ${{ vars.PRITSET_WEBHOOK_SETTLE_SECONDS || '10' }}
          PRITSET_TEMPLATE_PATH: tests/fixtures/staging-template.docx
        run: |
          set -euo pipefail
          java -cp "target/test-classes:target/classes:$(cat target/production-lifecycle.classpath)" com.pritset.sdk.ProductionLifecycle
